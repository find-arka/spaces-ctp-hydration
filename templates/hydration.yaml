{{- /* Files to distribute: <manifestsDir>/*.{yaml,yml}, without dotfiles. Glob does not descend into subfolders. */ -}}
{{- $dir := .Values.manifestsDir | trimPrefix "./" | trimSuffix "/" }}
{{- $paths := list }}
{{- range $path, $_ := .Files.Glob (printf "%s/*.{yaml,yml}" $dir) }}
{{- if not (hasPrefix "." (base $path)) }}
{{- $paths = append $paths $path }}
{{- end }}
{{- end }}
{{- if not $paths }}
{{- fail (printf "no *.yaml or *.yml files in %s (manifestsDir is relative to the chart root and must be inside it); put your manifests there, or try the example with -f examples/aws-s3/values.yaml" .Values.manifestsDir) }}
{{- end }}
{{- if not .Values.controlPlanes }}
{{- fail "controlPlanes is empty; add one {name, values} entry per control plane" }}
{{- end }}
{{- $seen := dict }}
{{- range $cp := .Values.controlPlanes }}
{{- $cpName := required "every controlPlanes entry needs a name" $cp.name }}
{{- if hasKey $seen $cpName }}
{{- fail (printf "control plane %s is listed twice in controlPlanes" $cpName) }}
{{- end }}
{{- $_ := set $seen $cpName true }}
{{- $name := printf "%s-%s" $.Release.Name $cpName }}
{{- if gt (len $name) 63 }}
{{- fail (printf "%s is longer than 63 characters; use a shorter release or control plane name" $name) }}
{{- end }}
{{- /* Each file is a template rendered with this control plane's values over the defaults. */ -}}
{{- $values := mergeOverwrite (deepCopy ($.Values.defaults | default dict)) (deepCopy ($cp.values | default dict)) }}
{{- $ctx := dict "Values" $values "ControlPlane" $cpName "Release" $.Release "Chart" $.Chart "Template" $.Template }}
{{- /* Files in file-name order, documents in file order. Empty and comment-only documents are skipped. */ -}}
{{- $manifests := list }}
{{- range $path := $paths }}
{{- range $i, $raw := regexSplit "(?m)^---[ \t\r]*$" (tpl ($.Files.Get $path) $ctx) -1 }}
{{- $doc := fromYaml $raw }}
{{- if hasKey $doc "Error" }}
{{- fail (printf "%s (control plane %s), document %d: %s" $path $cpName (add1 $i) $doc.Error) }}
{{- end }}
{{- if $doc }}
{{- if not (and $doc.apiVersion $doc.kind ($doc.metadata | default dict).name) }}
{{- fail (printf "%s (control plane %s), document %d: every manifest needs apiVersion, kind and metadata.name" $path $cpName (add1 $i)) }}
{{- end }}
{{- $manifests = append $manifests $doc }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $manifests }}
{{- fail (printf "the files in %s hold no manifests for control plane %s" $.Values.manifestsDir $cpName) }}
{{- end }}
{{- if gt (len $manifests) 100 }}
{{- fail (printf "control plane %s has %d manifests; a ResourceDistribution source holds at most 100" $cpName (len $manifests)) }}
{{- end }}
{{- $source := dict "type" "Inline" "inline" (dict "manifests" $manifests) }}
{{- with $.Values.strategy }}
{{- $_ := set $source "strategy" . }}
{{- end }}
{{- $sources := toYaml (list $source) }}
{{- if gt (len $sources) (int $.Values.maxManifestBytes) }}
{{- fail (printf "manifests for control plane %s render to %d bytes, over maxManifestBytes (%d); see values.yaml" $cpName (len $sources) (int $.Values.maxManifestBytes)) }}
{{- end }}
---
apiVersion: spaces.upbound.io/v1alpha1
kind: ResourceDistribution
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    spaces-ctp-hydration/control-plane: {{ $cpName }}
spec:
  controlPlaneSelector:
    names:
      - {{ $cpName }}
  deletionPolicy: {{ $.Values.deletionPolicy }}
  sources:
{{- $sources | nindent 4 }}
{{- end }}
