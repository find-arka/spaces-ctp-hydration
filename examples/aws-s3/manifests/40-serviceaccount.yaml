# Shows a value that differs per control plane. The annotation is the IRSA
# style role binding; EKS Pod Identity instead associates a role with a
# namespace and ServiceAccount name on the AWS side. How either reaches a
# provider running in a Spaces control plane is not verified by this example.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-aws-identity
  namespace: crossplane-system
  annotations:
    eks.amazonaws.com/role-arn: {{ required (printf "roleArn is required for control plane %s" .ControlPlane) .Values.roleArn | quote }}
